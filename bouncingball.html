<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
	<title></title>
</head>
<body>

	<script>
	let xpos;
let ypos;
let xspeed;
let yspeed;
let d


function setup() {
  createCanvas(800, 800);
  xpos = width / 2;
  ypos = height / 2;
  xspeed = 5;
  yspeed = 8;
  d = 50;
  circleColor = "white"

}

function draw() {
  background(200);

  
  xpos = xpos + xspeed;
  ypos = ypos + yspeed;

  
  if (xpos + d/2 > width || xpos - d/2 < 0) {
    xspeed *= -1;
  }
  if (ypos + d/2 > height || ypos - d/2 < 0) {
    yspeed *= -1;
  }
if(xpos > width/2 && ypos < height/2) {
circleColor = "black"
} else {
	circleColor = "white"

}


xpos += xspeed
ypos += yspeed

fill(circleColor)
  circle(xpos, ypos, d);
}

	</script>

</body>
</html>
