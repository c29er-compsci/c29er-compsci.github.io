<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
  <title>Bouncing Ball</title>
</head>
<body>

  <script>
    let xpos, ypos;
    let xspeed, yspeed;
    let d;
    let circleColor;

    function setup() {
      createCanvas(800, 800);
      xpos = width / 2;
      ypos = height / 2;
      
      // Initialize with starting speeds
      xspeed = 5;
      yspeed = 8;
      d = 50;
      circleColor = "white";
    }

    function draw() {
      background(220);

      // 1. Update diameter every frame (creates the flickering effect)
      d = getRandomDiameter();

      // 2. Move the ball
      xpos += xspeed;
      ypos += yspeed;

    
      if (xpos + d/2 > width || xpos - d/2 < 0) {
        // Reverse direction
        xspeed *= -1; 
      
        xspeed = getRandomXspeed() * Math.sign(xspeed);
      }
      
      if (ypos + d/2 > height || ypos - d/2 < 0) {
        yspeed *= -1;
      }

      // 4. Change color based on screen quadrant
      changeBallColor("green", "blue", "red", "yellow"); 

      // 5. Draw the ball
      fill(circleColor);
      noStroke();
      circle(xpos, ypos, d);
    }

    
    function getRandomXspeed() {
      return random(3, 12); 
    }

    
    function getRandomDiameter() {
      return random(30, 80);
    }

    function changeBallColor(topRight, bottomRight, topLeft, bottomLeft) {
      if (xpos > width/2 && ypos < height/2) {
        circleColor = topRight;    
      } else if (xpos < width/2 && ypos < height/2) {
        circleColor = topLeft;     
      } else if (xpos < width/2 && ypos > height/2) {
        circleColor = bottomLeft;  
      } else {
        circleColor = bottomRight; 
      }
    }
  </script>

</body>
</html>
