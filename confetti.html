<!DOCTYPE html>
<html>
<head>
	<style>
	.box{
		border:5px solid;
		background-image: url(https://a.espncdn.com/combiner/i?img=/i/headshots/nba/players/full/3934672.png&w=350&h=254);
		background-position: center;
		background-size: contain;
		background-repeat: no-repeat;

		position: absolute;
		display: inline-block;
	}
	</style>
</head>
<body>

<script>

let colors = ["blue", "green", "purple"]

function changeBackgroundColor() {
	let r = Math.floor(Math.random() * 255)
	let g = Math.floor(Math.random() * 255)
	let b = Math.floor(Math.random() * 255)

	document.body.style.backgroundColor =
		"rgb(" + r + "," + g + "," + b + ")"
}

setInterval(changeBackgroundColor, 1000)

function makeConfetti () {

	let square = document.createElement("div")
	square.classList.add("box")
	document.body.appendChild(square)

	let randomColorIndex = Math.floor(Math.random() * colors.length)
	square.style.borderColor = colors[randomColorIndex]

	square.style.top = Math.random() * window.innerHeight + "px"
	square.style.left = Math.random() * window.innerWidth + "px"
	square.style.height = Math.random() * 25 + "px"
	square.style.width = Math.random() * 25 + "px"

	function fall() {
		let fallFactor = 10
		square.style.top =
			parseInt(square.style.top) + fallFactor + "px"

		if (parseInt(square.style.top) > window.innerHeight) {
			square.style.top = "0px"
		}
	}

	setInterval(fall, 50)
}

// create 100 confetti pieces
for (let i = 0; i < 100; i++) {
	makeConfetti()
}

</script>

</body>
</html>
