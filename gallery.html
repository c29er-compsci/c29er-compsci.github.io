<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
<style>
	.container {
display: grid;
grid-template-columns: repeat(5,1fr);


	}

	.item {
border: 1px solid black;




	}

	.item img {
		width: 100%;
		height: 100%;
		object-fit: cover;
	}
	
#item1 {
		grid-column: 1 / 3;
		grid-row: 1 / 3;
	}

	@media (max-width: 800px) {
/*		body {
			background: blue;
		}*/
		.container {
			grid-template-columns: repeat(1, 1fr);
		}

		#item1 {
		grid-column: unset;
		grid-row: unset;
		}
	}


</style>

</head>
<body>

	<div class="container">
		
		<div class="item" id="item1">
			<img src="https://static.www.nfl.com/image/upload/t_player_profile_landscape/league/w3edoyyuomqlovvp9ixc" alt="Malik Nabers">
		</div>
	<div class="item" id="item2">
			<img src="https://a.espncdn.com/i/headshots/nba/players/full/3934672.png" alt="Jalen Brunson">
		</div>
		<div class="item" id="item3">
		<img src="https://a.espncdn.com/combiner/i?img=/i/headshots/mlb/players/full/39832.png&w=350&h=254" alt="Shohei Ohtani"></div>

		<div class="item" id="item4">
		<img src="https://static.www.nfl.com/image/upload/t_player_profile_landscape/league/n6uymxssgiicjmxkzxoc" alt="Jaxson Dart"></div>

		<div class="item" id="item5">
			<img src="https://a.espncdn.com/combiner/i?img=/i/headshots/mlb/players/full/33039.png" alt="Shohei Ohtani"></div>
	</div>


</body>
</html>
