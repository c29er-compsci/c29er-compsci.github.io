<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cookie Clicker Lite</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f5efe6;
    text-align: center;
    padding: 40px;
  }

  h1 {
    font-size: 3em;
  }

  #cookie {
    font-size: 120px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.1s;
  }

  #cookie:active {
    transform: scale(0.95);
  }

  .stats {
    font-size: 1.4em;
    margin: 20px 0;
  }

  .shop {
    margin-top: 30px;
  }

  button {
    padding: 10px 16px;
    font-size: 1em;
    margin: 6px;
    cursor: pointer;
  }
</style>
</head>

<body>

<h1>🍪 Cookie Clicker</h1>

<div id="cookie">🍪</div>

<div class="stats">
  Cookies: <span id="cookies">0</span><br>
  Cookies per second: <span id="cps">0</span>
</div>

<div class="shop">
  <h2>Shop</h2>
  <button onclick="buyCursor()">🖱 Cursor (10 cookies)</button><br>
  <button onclick="buyGrandma()">👵 Grandma (50 cookies)</button>
</div>

<script>
  let cookies = 0;
  let cps = 0;

  let cursors = 0;
  let grandmas = 0;

  // Load save
  if (localStorage.getItem("cookieSave")) {
    let save = JSON.parse(localStorage.getItem("cookieSave"));
    cookies = save.cookies;
    cursors = save.cursors;
    grandmas = save.grandmas;
    cps = cursors + grandmas * 5;
  }

  const cookieEl = document.getElementById("cookie");
  const cookiesEl = document.getElementById("cookies");
  const cpsEl = document.getElementById("cps");

  cookieEl.onclick = () => {
    cookies++;
    update();
  };

  function buyCursor() {
    if (cookies >= 10) {
      cookies -= 10;
      cursors++;
      cps += 1;
      update();
    }
  }

  function buyGrandma() {
    if (cookies >= 50) {
      cookies -= 50;
      grandmas++;
      cps += 5;
      update();
    }
  }

  function update() {
    cookiesEl.textContent = Math.floor(cookies);
    cpsEl.textContent = cps;
    saveGame();
  }

  function saveGame() {
    localStorage.setItem("cookieSave", JSON.stringify({
      cookies,
      cursors,
      grandmas
    }));
  }

  // Passive income
  setInterval(() => {
    cookies += cps / 10;
    update();
  }, 100);

  update();
</script>

</body>
</html>
