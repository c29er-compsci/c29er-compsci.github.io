<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Studio Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-magenta: #ff00ff;
            --neon-yellow: #ffff00;
            --dark-bg: #0a0a0f;
            --darker-bg: #050508;
            --card-bg: #1a1a24;
            --text-primary: #ffffff;
            --text-secondary: #b0b0c8;
            --border-color: #2a2a3e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 255, 0.03) 2px, rgba(0, 255, 255, 0.03) 4px),
                radial-gradient(ellipse at 50% 0%, rgba(0, 255, 255, 0.1), transparent 70%),
                radial-gradient(ellipse at 100% 100%, rgba(255, 0, 255, 0.08), transparent 60%);
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
            z-index: 1000;
            animation: scanline 8s linear infinite;
        }

        @keyframes scanline {
            0% { transform: translateY(0); }
            100% { transform: translateY(10px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 60px 20px;
            position: relative;
        }

        .studio-name {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glitch 3s infinite;
            cursor: pointer;
            transition: all 0.3s;
        }

        .studio-name:hover {
            filter: drop-shadow(0 0 20px var(--neon-cyan));
        }

        @keyframes glitch {
            0%, 90%, 100% {
                transform: translate(0);
            }
            92% {
                transform: translate(-2px, 2px);
            }
            94% {
                transform: translate(2px, -2px);
            }
            96% {
                transform: translate(-2px, -2px);
            }
        }

        .studio-tagline {
            font-size: 1.2rem;
            color: var(--text-secondary);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 600;
        }

        .edit-mode-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 24px;
            background: var(--card-bg);
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            z-index: 100;
        }

        .edit-mode-btn:hover {
            background: var(--neon-cyan);
            color: var(--dark-bg);
            box-shadow: 0 0 30px var(--neon-cyan);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            padding: 40px 20px;
        }

        .game-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-cyan);
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.3);
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .game-card:hover::before {
            left: 100%;
        }

        .game-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            filter: brightness(0.8);
            transition: all 0.4s;
        }

        .game-card:hover .game-image {
            filter: brightness(1) contrast(1.1);
        }

        .game-content {
            padding: 25px;
        }

        .game-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .game-bio {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .game-link {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            border: 2px solid var(--neon-magenta);
            color: var(--neon-magenta);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-size: 0.9rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .game-link::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--neon-magenta);
            transition: left 0.3s;
            z-index: -1;
        }

        .game-link:hover::before {
            left: 0;
        }

        .game-link:hover {
            color: var(--dark-bg);
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        .add-game-btn {
            padding: 20px 40px;
            background: var(--darker-bg);
            border: 3px dashed var(--border-color);
            color: var(--text-secondary);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
        }

        .add-game-btn:hover {
            border-color: var(--neon-yellow);
            color: var(--neon-yellow);
            background: var(--card-bg);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1001;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border: 2px solid var(--neon-cyan);
            max-width: 600px;
            width: 90%;
            clip-path: polygon(30px 0, 100% 0, 100% calc(100% - 30px), calc(100% - 30px) 100%, 0 100%, 0 30px);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.5);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 30px;
            color: var(--neon-cyan);
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            background: var(--darker-bg);
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 12px 30px;
            border: 2px solid;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background: var(--neon-cyan);
            border-color: var(--neon-cyan);
            color: var(--dark-bg);
        }

        .btn-primary:hover {
            box-shadow: 0 0 30px var(--neon-cyan);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--text-primary);
            color: var(--text-primary);
        }

        .delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            background: var(--neon-magenta);
            border: none;
            color: var(--dark-bg);
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            transition: all 0.3s;
        }

        .delete-btn:hover {
            box-shadow: 0 0 20px var(--neon-magenta);
            transform: scale(1.1);
        }

        body.edit-mode .delete-btn {
            display: flex;
        }

        @media (max-width: 768px) {
            .games-grid {
                grid-template-columns: 1fr;
            }

            .studio-name {
                font-size: 2.5rem;
            }

            .edit-mode-btn {
                padding: 10px 16px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    
    <button class="edit-mode-btn" onclick="toggleEditMode()">Edit Mode</button>

    <div class="container">
        <div class="header">
            <h1 class="studio-name" onclick="editStudioName()">NEON FORGE</h1>
            <p class="studio-tagline">Game Development Studio</p>
        </div>

        <div class="games-grid" id="gamesGrid">
            <!-- Sample games will be populated here -->
        </div>
    </div>

    <!-- Modal for adding/editing games -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 class="modal-title" id="modalTitle">Add New Game</h2>
            <form id="gameForm">
                <div class="form-group">
                    <label for="gameTitle">Game Title</label>
                    <input type="text" id="gameTitle" required>
                </div>
                <div class="form-group">
                    <label for="gameImage">Image URL</label>
                    <input type="url" id="gameImage" placeholder="https://example.com/image.jpg" required>
                </div>
                <div class="form-group">
                    <label for="gameBio">Game Description</label>
                    <textarea id="gameBio" required></textarea>
                </div>
                <div class="form-group">
                    <label for="gameLink">Game Link</label>
                    <input type="url" id="gameLink" placeholder="https://example.com/game" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Game</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let games = [
            {
                title: "Cyber Runners",
                image: "https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=800&h=500&fit=crop",
                bio: "Fast-paced cyberpunk parkour game set in a dystopian megacity. Run, jump, and hack your way through neon-lit streets while evading corporate security forces.",
                link: "#"
            },
            {
                title: "Void Crusade",
                image: "https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=800&h=500&fit=crop",
                bio: "Epic space combat simulator with tactical fleet battles. Command massive starships, manage resources, and conquer the galaxy in this strategic warfare experience.",
                link: "#"
            },
            {
                title: "Neon Drift",
                image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=800&h=500&fit=crop",
                bio: "Arcade racing game featuring anti-gravity vehicles and synthwave aesthetics. Master impossible tracks floating through neon-soaked cityscapes at breakneck speeds.",
                link: "#"
            }
        ];

        let studioName = "NEON FORGE";
        let editingIndex = -1;

        function loadGames() {
            const savedGames = localStorage.getItem('games');
            const savedStudioName = localStorage.getItem('studioName');
            
            if (savedGames) {
                games = JSON.parse(savedGames);
            }
            
            if (savedStudioName) {
                studioName = savedStudioName;
                document.querySelector('.studio-name').textContent = studioName;
            }
            
            renderGames();
        }

        function saveGames() {
            localStorage.setItem('games', JSON.stringify(games));
            localStorage.setItem('studioName', studioName);
        }

        function renderGames() {
            const grid = document.getElementById('gamesGrid');
            grid.innerHTML = '';

            games.forEach((game, index) => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteGame(${index})">×</button>
                    <img src="${game.image}" alt="${game.title}" class="game-image">
                    <div class="game-content">
                        <h3 class="game-title">${game.title}</h3>
                        <p class="game-bio">${game.bio}</p>
                        <a href="${game.link}" class="game-link" target="_blank">Play Now</a>
                    </div>
                `;
                card.querySelector('.game-image').addEventListener('click', () => editGame(index));
                card.querySelector('.game-title').addEventListener('click', () => editGame(index));
                grid.appendChild(card);
            });

            const addBtn = document.createElement('button');
            addBtn.className = 'add-game-btn';
            addBtn.textContent = '+ Add New Game';
            addBtn.onclick = () => openModal();
            grid.appendChild(addBtn);
        }

        function toggleEditMode() {
            document.body.classList.toggle('edit-mode');
            const btn = document.querySelector('.edit-mode-btn');
            btn.textContent = document.body.classList.contains('edit-mode') ? 'Exit Edit Mode' : 'Edit Mode';
        }

        function editStudioName() {
            if (document.body.classList.contains('edit-mode')) {
                const newName = prompt('Enter studio name:', studioName);
                if (newName && newName.trim()) {
                    studioName = newName.trim().toUpperCase();
                    document.querySelector('.studio-name').textContent = studioName;
                    saveGames();
                }
            }
        }

        function openModal(index = -1) {
            editingIndex = index;
            const modal = document.getElementById('gameModal');
            const form = document.getElementById('gameForm');
            const title = document.getElementById('modalTitle');

            if (index >= 0) {
                const game = games[index];
                title.textContent = 'Edit Game';
                document.getElementById('gameTitle').value = game.title;
                document.getElementById('gameImage').value = game.image;
                document.getElementById('gameBio').value = game.bio;
                document.getElementById('gameLink').value = game.link;
            } else {
                title.textContent = 'Add New Game';
                form.reset();
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
            document.getElementById('gameForm').reset();
            editingIndex = -1;
        }

        function editGame(index) {
            if (document.body.classList.contains('edit-mode')) {
                openModal(index);
            }
        }

        function deleteGame(index) {
            if (confirm('Are you sure you want to delete this game?')) {
                games.splice(index, 1);
                saveGames();
                renderGames();
            }
        }

        document.getElementById('gameForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const game = {
                title: document.getElementById('gameTitle').value,
                image: document.getElementById('gameImage').value,
                bio: document.getElementById('gameBio').value,
                link: document.getElementById('gameLink').value
            };

            if (editingIndex >= 0) {
                games[editingIndex] = game;
            } else {
                games.push(game);
            }

            saveGames();
            renderGames();
            closeModal();
        });

        // Close modal when clicking outside
        document.getElementById('gameModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize
        loadGames();
    </script>
</body>
</html>
