<!DOCTYPE html>
<html>
<head>
  <title>SPELUNKY DELUXE</title>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Russo+One&family=Bangers&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    
    @keyframes glow {
      0%, 100% { 
        text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd700, 0 0 60px #ff8800;
      }
      50% { 
        text-shadow: 0 0 30px #ffd700, 0 0 60px #ffd700, 0 0 90px #ff8800, 0 0 120px #ff4400;
      }
    }
    
    @keyframes slideIn {
      from { 
        opacity: 0;
        transform: translateY(-30px);
      }
      to { 
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    
    body { 
      margin: 0; 
      background: radial-gradient(ellipse at center, #2a1810 0%, #000000 100%);
      font-family: 'Russo One', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.05) 2px,
          rgba(0, 0, 0, 0.05) 4px
        );
      pointer-events: none;
      z-index: 1;
      animation: flicker 0.15s infinite;
    }
    
    canvas { 
      display: block; 
      background: linear-gradient(180deg, #1a0f0a 0%, #2b1810 50%, #1a0f0a 100%);
      border: 6px solid #ffd700;
      box-shadow: 
        0 0 40px rgba(255, 215, 0, 0.6),
        inset 0 0 60px rgba(0, 0, 0, 0.9),
        0 20px 60px rgba(0, 0, 0, 0.9);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      position: relative;
      z-index: 2;
    }
    
    #hud {
      color: #ffd700;
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 
        0 0 20px #ffd700,
        3px 3px 0 #000,
        -1px -1px 0 #000;
      display: flex;
      gap: 40px;
      font-weight: bold;
      z-index: 3;
      position: relative;
      animation: slideIn 0.6s ease-out;
      font-family: 'Bungee', cursive;
    }
    
    #hud > div {
      background: linear-gradient(135deg, rgba(255, 140, 0, 0.3), rgba(139, 69, 20, 0.4));
      padding: 15px 30px;
      border-radius: 12px;
      border: 4px solid #ff8c00;
      box-shadow: 
        0 0 30px rgba(255, 140, 0, 0.5),
        inset 0 0 20px rgba(255, 215, 0, 0.2);
      transition: all 0.3s ease;
      animation: bounce 3s ease-in-out infinite;
    }
    
    #hud > div:nth-child(2) { animation-delay: 0.1s; }
    #hud > div:nth-child(3) { animation-delay: 0.2s; }
    #hud > div:nth-child(4) { animation-delay: 0.3s; }
    #hud > div:nth-child(5) { animation-delay: 0.4s; }
    
    #menu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, rgba(60, 30, 15, 0.98), rgba(30, 15, 8, 0.98));
      border: 8px solid #ffd700;
      padding: 60px 100px;
      text-align: center;
      color: #ffd700;
      box-shadow: 
        0 0 80px rgba(255, 215, 0, 0.8),
        inset 0 0 80px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }
    
    #menu h1 {
      font-size: 110px;
      margin: 0 0 40px 0;
      text-shadow: 
        0 0 30px #ffd700,
        0 0 60px #ff8800,
        6px 6px 0 #000,
        -2px -2px 0 #000;
      color: #ffed4e;
      font-family: 'Bangers', cursive;
      letter-spacing: 12px;
      animation: glow 2s infinite, pulse 2s infinite;
      transform-origin: center;
    }
    
    #menu button {
      background: linear-gradient(135deg, #ff8c00, #ffd700);
      color: #000;
      border: 5px solid #000;
      padding: 25px 60px;
      font-size: 36px;
      font-family: 'Bungee', cursive;
      cursor: pointer;
      margin: 20px;
      font-weight: bold;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      letter-spacing: 2px;
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(255, 255, 255, 0.3);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    #menu button::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transform: rotate(45deg);
      transition: all 0.5s;
    }
    
    #menu button:hover::before {
      left: 100%;
    }
    
    #menu button:hover {
      transform: scale(1.15) translateY(-8px) rotate(2deg);
      box-shadow: 
        0 20px 50px rgba(255, 215, 0, 0.8),
        inset 0 0 40px rgba(255, 255, 255, 0.5);
    }
    
    #menu button:active {
      transform: scale(1.08) translateY(-4px);
    }
    
    .controls {
      margin-top: 40px;
      font-size: 24px;
      line-height: 2.5;
      text-align: left;
      animation: slideIn 0.8s ease-out 0.2s both;
      font-family: 'Russo One', sans-serif;
    }
    
    .controls div {
      padding: 12px 0;
      border-left: 6px solid #ff8c00;
      padding-left: 25px;
      margin: 12px 0;
      transition: all 0.3s ease;
      background: linear-gradient(90deg, rgba(255, 140, 0, 0.1), transparent);
    }
    
    .controls div:hover {
      border-left-width: 12px;
      padding-left: 35px;
      background: linear-gradient(90deg, rgba(255, 140, 0, 0.3), transparent);
      transform: translateX(10px);
    }
    
    .hidden {
      display: none !important;
    }
    
    #deathScreen {
      background: linear-gradient(135deg, rgba(60, 0, 0, 0.98), rgba(20, 0, 0, 0.98));
      border: 8px solid #ff0000;
    }
    
    #deathScreen h1 {
      color: #ff0000;
      animation: glow 1.5s infinite;
      text-shadow: 
        0 0 30px #ff0000,
        0 0 60px #ff0000,
        6px 6px 0 #000;
    }
    
    .stat-line {
      font-size: 30px;
      margin: 20px 0;
      color: #fff;
      text-shadow: 
        0 0 10px #fff,
        3px 3px 0 #000;
      animation: slideIn 0.6s ease-out backwards;
      font-family: 'Russo One', sans-serif;
    }
    
    .stat-line:nth-child(2) { animation-delay: 0.1s; }
    .stat-line:nth-child(3) { animation-delay: 0.2s; }
    .stat-line:nth-child(4) { animation-delay: 0.3s; }
    
    .death-cause {
      font-size: 42px;
      color: #ff6b6b;
      margin: 35px 0;
      font-weight: bold;
      text-shadow: 
        0 0 30px #ff0000,
        4px 4px 0 #000;
      animation: pulse 1s infinite, slideIn 0.4s ease-out;
      font-family: 'Bangers', cursive;
      letter-spacing: 3px;
    }

    #notification {
      position: fixed;
      top: 120px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: linear-gradient(135deg, rgba(255, 140, 0, 0.95), rgba(255, 215, 0, 0.95));
      color: #000;
      padding: 20px 40px;
      border-radius: 15px;
      border: 4px solid #000;
      font-family: 'Bungee', cursive;
      font-size: 28px;
      z-index: 100;
      opacity: 0;
      transition: all 0.5s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    #notification.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
<div id="notification"></div>

<div id="hud" class="hidden">
  <div>❤️ <span id="health">4</span></div>
  <div>💣 <span id="bombs">3</span></div>
  <div>🪢 <span id="ropes">3</span></div>
  <div>💰 <span id="gold">0</span></div>
  <div>📍 <span id="level">1-1</span></div>
</div>
<canvas id="game" width="960" height="720"></canvas>

<div id="menu">
  <h1>⛏️ SPELUNKY ⛏️</h1>
  <div id="mainMenu">
    <button onclick="startGame()">START GAME</button>
    <button onclick="showControls()">CONTROLS</button>
  </div>
  <div id="controlsMenu" class="hidden">
    <div class="controls">
      <div><strong>WASD</strong> - Move & Climb</div>
      <div><strong>SPACE</strong> - Attack with Whip</div>
      <div><strong>B</strong> - Throw Bomb</div>
      <div><strong>R</strong> - Deploy Rope</div>
      <div><strong>E</strong> - Pick up items</div>
      <div style="margin-top: 20px; color: #ff6b6b;">⚠️ Watch for traps!</div>
      <div>💎 Collect gems for extra points!</div>
      <div>🏃 Reach the exit door to advance!</div>
    </div>
    <button onclick="showMainMenu()">BACK</button>
  </div>
</div>

<div id="deathScreen" class="hidden" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: linear-gradient(135deg, rgba(60, 0, 0, 0.98), rgba(20, 0, 0, 0.98)); border: 8px solid #ff0000; padding: 60px 100px; text-align: center; color: #ffd700; box-shadow: 0 0 100px rgba(255, 0, 0, 0.8), inset 0 0 100px rgba(0, 0, 0, 0.8); z-index: 10;">
  <h1>💀 YOU DIED 💀</h1>
  <div class="death-cause" id="deathCause"></div>
  <div class="stat-line">Level Reached: <span id="finalLevel"></span></div>
  <div class="stat-line">Gold Collected: $<span id="finalGold"></span></div>
  <div class="stat-line">Enemies Defeated: <span id="finalKills"></span></div>
  <button onclick="restartGame()" style="margin-top: 30px; background: linear-gradient(135deg, #ff0000, #ff6b6b); color: #fff; border: 5px solid #000; padding: 25px 60px; font-size: 36px; font-family: 'Bungee', cursive; cursor: pointer; font-weight: bold; letter-spacing: 2px;">TRY AGAIN</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const TILE = 40;
const GRAVITY = 0.6;
const mapWidth = 40;
const mapHeight = 30;

ctx.imageSmoothingEnabled = false;

let camera = { x: 0, y: 0 };
let gameStarted = false;
let screenShake = { x: 0, y: 0, intensity: 0 };

const THEMES = {
  CAVE: { 
    name: 'Cave', 
    bg: '#1a0f0a', 
    rock: '#654321',
    rockDark: '#4a3319',
    rockLight: '#8b6914'
  },
  JUNGLE: { 
    name: 'Jungle', 
    bg: '#0a1a0a', 
    rock: '#2d5016',
    rockDark: '#1a3010',
    rockLight: '#3d6026'
  },
  ICE: { 
    name: 'Ice Cave', 
    bg: '#0a0f1a', 
    rock: '#4a6b8a',
    rockDark: '#2a4b6a',
    rockLight: '#6a8baa'
  },
  VOLCANO: { 
    name: 'Volcano', 
    bg: '#1a0a0a', 
    rock: '#8b1a1a',
    rockDark: '#5a0a0a',
    rockLight: '#ab2a2a'
  }
};

let currentTheme = THEMES.CAVE;

let gameState = {
  level: 1,
  sublevel: 1,
  bombs: 3,
  ropes: 3,
  health: 4,
  gold: 0,
  kills: 0,
  hasSpikeBboots: false,
  hasCape: false,
  hasCompass: false,
  hasSpectacles: false,
  shopkeeperAngry: false,
  deathCause: '',
  damageInvincibility: 0
};

let map = [];
let door = { x: 0, y: 0 };
let bombs = [];
let ropes = [];
let whip = { active: false, frames: 0, flip: false };
let particles = [];
let gold = [];
let items = [];
let traps = [];
let arrows = [];
let shops = [];
let crates = [];
let gems = [];

function showNotification(text) {
  const notif = document.getElementById('notification');
  notif.textContent = text;
  notif.classList.add('show');
  setTimeout(() => {
    notif.classList.remove('show');
  }, 2000);
}

function showControls() {
  document.getElementById("mainMenu").classList.add("hidden");
  document.getElementById("controlsMenu").classList.remove("hidden");
}

function showMainMenu() {
  document.getElementById("mainMenu").classList.remove("hidden");
  document.getElementById("controlsMenu").classList.add("hidden");
}

function startGame() {
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  gameStarted = true;
  resetLevel();
  showNotification("🎮 GAME START!");
}

function restartGame() {
  document.getElementById("deathScreen").classList.add("hidden");
  document.getElementById("hud").classList.remove("hidden");
  gameState = {
    level: 1,
    sublevel: 1,
    bombs: 3,
    ropes: 3,
    health: 4,
    gold: 0,
    kills: 0,
    hasSpikeBboots: false,
    hasCape: false,
    hasCompass: false,
    hasSpectacles: false,
    shopkeeperAngry: false,
    deathCause: '',
    damageInvincibility: 0
  };
  updateTheme();
  resetLevel();
  gameStarted = true;
  showNotification("🔄 TRY AGAIN!");
}

function updateTheme() {
  if (gameState.level === 1) currentTheme = THEMES.CAVE;
  else if (gameState.level === 2) currentTheme = THEMES.JUNGLE;
  else if (gameState.level === 3) currentTheme = THEMES.ICE;
  else currentTheme = THEMES.VOLCANO;
}

function generateCaveMap() {
  map = [];
  
  for (let y = 0; y < mapHeight; y++) {
    let row = [];
    for (let x = 0; x < mapWidth; x++) {
      row.push(1);
    }
    map.push(row);
  }
  
  let caves = [];
  for (let y = 0; y < mapHeight; y++) {
    caves[y] = [];
    for (let x = 0; x < mapWidth; x++) {
      caves[y][x] = Math.random() > 0.47 ? 1 : 0;
    }
  }
  
  for (let iter = 0; iter < 5; iter++) {
    let newCaves = [];
    for (let y = 0; y < mapHeight; y++) {
      newCaves[y] = [];
      for (let x = 0; x < mapWidth; x++) {
        let neighbors = 0;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (caves[y + dy] && caves[y + dy][x + dx]) neighbors++;
          }
        }
        newCaves[y][x] = neighbors >= 5 ? 1 : 0;
      }
    }
    caves = newCaves;
  }
  
  map = caves;
  
  // Starting area
  for (let y = 1; y < 5; y++) {
    for (let x = 2; x < 6; x++) {
      if (map[y]) map[y][x] = 0;
    }
  }
  
  // Main shaft
  let shaftX = Math.floor(mapWidth / 2);
  for (let y = 5; y < mapHeight - 3; y++) {
    if (Math.random() > 0.25 && map[y]) {
      map[y][shaftX] = 0;
      if (Math.random() > 0.4 && map[y][shaftX + 1] !== undefined) map[y][shaftX + 1] = 0;
    }
  }
  
  // Exit area
  door.x = mapWidth - 5;
  door.y = mapHeight - 3;
  for (let y = door.y; y <= door.y + 1; y++) {
    for (let x = door.x - 1; x <= door.x + 2; x++) {
      if (map[y] && map[y][x] !== undefined) map[y][x] = 0;
    }
  }
}

function generateTraps() {
  traps = [];
  arrows = [];
  
  let trapCount = Math.min(5, 3 + gameState.level);
  for (let i = 0; i < trapCount; i++) {
    let x = Math.floor(Math.random() * (mapWidth - 4) + 2);
    let y = Math.floor(Math.random() * (mapHeight - 6) + 3);
    
    if (map[y] && map[y][x] === 1 && map[y][x-1] === 0) {
      traps.push({ 
        x: x * TILE, 
        y: y * TILE, 
        type: 'arrow', 
        direction: -1,
        active: true,
        cooldown: 0
      });
    } else if (map[y] && map[y][x] === 1 && map[y][x+1] === 0) {
      traps.push({ 
        x: x * TILE, 
        y: y * TILE, 
        type: 'arrow', 
        direction: 1,
        active: true,
        cooldown: 0
      });
    }
  }
  
  for (let i = 0; i < Math.min(8, 5 + gameState.level); i++) {
    let x = Math.floor(Math.random() * mapWidth);
    let y = Math.floor(Math.random() * (mapHeight - 5) + 3);
    
    if (map[y] && map[y][x] === 0 && map[y+1] && map[y+1][x] === 1) {
      traps.push({ 
        x: x * TILE, 
        y: y * TILE, 
        type: 'spike', 
        active: true 
      });
    }
  }
}

function generateCrates() {
  crates = [];
  for (let i = 0; i < 5 + gameState.level; i++) {
    let x = Math.floor(Math.random() * mapWidth) * TILE;
    let y = Math.floor(Math.random() * mapHeight) * TILE;
    
    if (!solidAt(x, y) && solidAt(x, y + TILE)) {
      crates.push({ x, y, broken: false });
    }
  }
}

function generateGems() {
  gems = [];
  for (let i = 0; i < 3 + gameState.level; i++) {
    let x = Math.floor(Math.random() * mapWidth) * TILE;
    let y = Math.floor(Math.random() * mapHeight) * TILE;
    
    if (!solidAt(x, y)) {
      let type = Math.random();
      gems.push({ 
        x, 
        y, 
        type: type > 0.8 ? 'ruby' : type > 0.5 ? 'emerald' : 'sapphire',
        value: type > 0.8 ? 1000 : type > 0.5 ? 500 : 300,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }
}

function generateShop() {
  shops = [];
  
  if (Math.random() > 0.65) {
    let shopX = Math.floor(mapWidth / 3);
    let shopY = Math.floor(mapHeight / 2);
    
    for (let y = shopY; y < shopY + 4; y++) {
      for (let x = shopX; x < shopX + 6; x++) {
        if (map[y] && map[y][x] !== undefined) map[y][x] = 0;
      }
    }
    
    if (map[shopY + 4]) {
      for (let x = shopX; x < shopX + 6; x++) {
        if (map[shopY + 4][x] !== undefined) map[shopY + 4][x] = 1;
      }
    }
    
    shops.push({
      x: shopX * TILE,
      y: shopY * TILE,
      shopkeeper: {
        x: (shopX + 1) * TILE,
        y: (shopY + 2) * TILE,
        vx: 0,
        angry: gameState.shopkeeperAngry,
        health: 10
      },
      items: [
        { x: (shopX + 2) * TILE, y: (shopY + 3) * TILE, type: 'bombs', cost: 200 },
        { x: (shopX + 3) * TILE, y: (shopY + 3) * TILE, type: 'ropes', cost: 200 },
        { x: (shopX + 4) * TILE, y: (shopY + 3) * TILE, type: 'compass', cost: 500 }
      ]
    });
  }
}

const player = {
  x: 100,
  y: 80,
  vx: 0,
  vy: 0,
  width: 28,
  height: 32,
  onGround: false,
  onRope: false,
  facingRight: true,
  climbing: false
};

let enemies = [];

function spawnEnemies() {
  enemies = [];
  let count = Math.min(6, 3 + gameState.level);
  
  for (let i = 0; i < count; i++) {
    let x, y;
    let attempts = 0;
    do {
      x = Math.floor(Math.random() * (mapWidth - 10) + 5) * TILE;
      y = Math.floor(Math.random() * (mapHeight - 10) + 5) * TILE;
      attempts++;
    } while ((solidAt(x, y) || solidAt(x, y + TILE)) && attempts < 50);
    
    if (attempts < 50) {
      let type = 'spider';
      let rand = Math.random();
      
      if (gameState.level === 1) {
        type = rand > 0.7 ? 'bat' : rand > 0.4 ? 'spider' : 'snake';
      } else if (gameState.level === 2) {
        type = rand > 0.6 ? 'bat' : rand > 0.3 ? 'caveman' : 'snake';
      } else {
        type = rand > 0.5 ? 'skeleton' : rand > 0.3 ? 'bat' : 'caveman';
      }
      
      enemies.push({ 
        x, 
        y, 
        vx: Math.random() > 0.5 ? 2 : -2,
        vy: 0,
        health: type === 'skeleton' ? 3 : type === 'caveman' ? 3 : 2,
        type: type,
        onGround: false,
        stunned: false,
        reassembleTimer: 0
      });
    }
  }
}

function spawnGold() {
  gold = [];
  let count = 6 + gameState.level;
  for (let i = 0; i < count; i++) {
    let x, y;
    let attempts = 0;
    do {
      x = Math.floor(Math.random() * mapWidth) * TILE;
      y = Math.floor(Math.random() * mapHeight) * TILE;
      attempts++;
    } while (solidAt(x, y) && attempts < 50);
    
    if (attempts < 50) {
      gold.push({ 
        x, 
        y, 
        value: Math.random() > 0.7 ? 500 : 100,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }
}

function spawnItems() {
  items = [];
  
  if (Math.random() > 0.5) {
    let x = Math.floor(Math.random() * mapWidth) * TILE;
    let y = Math.floor(Math.random() * mapHeight) * TILE;
    items.push({ x, y, type: 'bombs', collected: false });
  }
  
  if (Math.random() > 0.5) {
    let x = Math.floor(Math.random() * mapWidth) * TILE;
    let y = Math.floor(Math.random() * mapHeight) * TILE;
    items.push({ x, y, type: 'ropes', collected: false });
  }
  
  if (Math.random() > 0.8 && !gameState.hasSpikeBboots) {
    let x = Math.floor(Math.random() * mapWidth) * TILE;
    let y = Math.floor(Math.random() * mapHeight) * TILE;
    items.push({ x, y, type: 'spikeboots', collected: false });
  }
  
  if (Math.random() > 0.85 && !gameState.hasSpectacles) {
    let x = Math.floor(Math.random() * mapWidth) * TILE;
    let y = Math.floor(Math.random() * mapHeight) * TILE;
    items.push({ x, y, type: 'spectacles', collected: false });
  }
}

let keys = {};
document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
  
  if (!gameStarted) return;
  
  if (e.key.toLowerCase() === "b" && gameState.bombs > 0 && !whip.active) {
    gameState.bombs--;
    updateHUD();
    bombs.push({
      x: player.x + (player.facingRight ? player.width : -TILE),
      y: player.y + player.height / 2,
      vx: player.facingRight ? 10 : -10,
      vy: -5,
      timer: 90,
      exploded: false
    });
    showNotification("💣 BOMB THROWN!");
  }
  
  if (e.key.toLowerCase() === "r" && gameState.ropes > 0) {
    gameState.ropes--;
    updateHUD();
    
    let ropeX = Math.floor((player.x + player.width/2) / TILE) * TILE;
    let ropeY = Math.floor(player.y / TILE) * TILE;
    
    let ropeLength = 0;
    for (let i = 0; i < 8; i++) {
      if (!solidAt(ropeX + TILE/2, ropeY - i * TILE)) {
        ropes.push({ x: ropeX, y: ropeY - i * TILE, segment: i });
        ropeLength++;
      } else {
        break;
      }
    }
    
    if (ropeLength > 0) {
      showNotification("🪢 ROPE DEPLOYED!");
    }
  }
  
  if (e.key === " " && !whip.active) {
    e.preventDefault();
    whip.active = true;
    whip.frames = 12;
    whip.flip = !player.facingRight;
  }
  
  if (e.key.toLowerCase() === "e") {
    // Pick up items
    items = items.filter(item => {
      if (!item || item.collected) return false;
      if (
        Math.abs(player.x - item.x) < TILE &&
        Math.abs(player.y - item.y) < TILE
      ) {
        if (item.type === 'bombs') {
          gameState.bombs += 3;
          showNotification("💣 +3 BOMBS!");
        } else if (item.type === 'ropes') {
          gameState.ropes += 3;
          showNotification("🪢 +3 ROPES!");
        } else if (item.type === 'spikeboots') {
          gameState.hasSpikeBboots = true;
          showNotification("👢 SPIKE BOOTS!");
        } else if (item.type === 'spectacles') {
          gameState.hasSpectacles = true;
          showNotification("👓 SPECTACLES!");
        } else if (item.type === 'compass') {
          gameState.hasCompass = true;
          showNotification("🧭 COMPASS!");
        }
        updateHUD();
        item.collected = true;
        return false;
      }
      return true;
    });
    
    // Shop purchases
    shops.forEach(shop => {
      if (!shop || !shop.items) return;
      shop.items = shop.items.filter(item => {
        if (Math.abs(player.x - item.x) < TILE && Math.abs(player.y - item.y) < TILE) {
          if (gameState.gold >= item.cost) {
            gameState.gold -= item.cost;
            if (item.type === 'bombs') {
              gameState.bombs += 3;
              showNotification("💣 BOUGHT 3 BOMBS!");
            } else if (item.type === 'ropes') {
              gameState.ropes += 3;
              showNotification("🪢 BOUGHT 3 ROPES!");
            } else if (item.type === 'compass') {
              gameState.hasCompass = true;
              showNotification("🧭 BOUGHT COMPASS!");
            }
            updateHUD();
            return false;
          } else {
            gameState.shopkeeperAngry = true;
            if (shop.shopkeeper) shop.shopkeeper.angry = true;
            showNotification("😡 SHOPKEEPER ANGRY!");
            if (item.type === 'bombs') gameState.bombs += 3;
            else if (item.type === 'ropes') gameState.ropes += 3;
            else if (item.type === 'compass') gameState.hasCompass = true;
            updateHUD();
            return false;
          }
        }
        return true;
      });
    });
    
    // Break crates
    crates.forEach(crate => {
      if (!crate.broken && Math.abs(player.x - crate.x) < TILE * 1.5 && Math.abs(player.y - crate.y) < TILE * 1.5) {
        crate.broken = true;
        
        for (let i = 0; i < 10; i++) {
          particles.push({
            x: crate.x + TILE/2,
            y: crate.y + TILE/2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 2,
            life: 30,
            size: Math.random() * 4 + 2,
            color: '#8b7355'
          });
        }
        
        if (Math.random() > 0.5) {
          gold.push({
            x: crate.x,
            y: crate.y,
            value: Math.random() > 0.7 ? 500 : 200,
            pulse: Math.random() * Math.PI * 2
          });
        }
      }
    });
  }
});

document.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

function solidAt(x, y) {
  let tx = Math.floor(x / TILE);
  let ty = Math.floor(y / TILE);
  if (ty < 0 || ty >= mapHeight || tx < 0 || tx >= mapWidth) return true;
  return map[ty] && map[ty][tx] === 1;
}

function isRopeAt(x, y) {
  return ropes.some(rope => 
    Math.abs(rope.x + TILE/2 - x) < TILE/2 && 
    Math.abs(rope.y + TILE/2 - y) < TILE/2
  );
}

function destroyBlock(tx, ty) {
  if (ty >= 0 && ty < mapHeight && tx >= 0 && tx < mapWidth) {
    if (map[ty] && map[ty][tx] === 1) {
      map[ty][tx] = 0;
      
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: tx * TILE + TILE/2,
          y: ty * TILE + TILE/2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 2,
          life: 30,
          size: Math.random() * 4 + 2,
          color: currentTheme.rock
        });
      }
      
      screenShake.intensity = 8;
    }
  }
}

function updateCamera() {
  let targetX = player.x - canvas.width / 2 + player.width / 2;
  let targetY = player.y - canvas.height / 2 + player.height / 2;
  
  targetX = Math.max(0, Math.min(targetX, mapWidth * TILE - canvas.width));
  targetY = Math.max(0, Math.min(targetY, mapHeight * TILE - canvas.height));
  
  camera.x += (targetX - camera.x) * 0.1;
  camera.y += (targetY - camera.y) * 0.1;
  
  if (screenShake.intensity > 0) {
    screenShake.x = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.y = (Math.random() - 0.5) * screenShake.intensity;
    screenShake.intensity *= 0.85;
    if (screenShake.intensity < 0.5) screenShake.intensity = 0;
  }
}

function die(cause) {
  gameState.deathCause = cause;
  document.getElementById("deathCause").textContent = cause;
  document.getElementById("finalLevel").textContent = `${gameState.level}-${gameState.sublevel}`;
  document.getElementById("finalGold").textContent = gameState.gold;
  document.getElementById("finalKills").textContent = gameState.kills;
  document.getElementById("hud").classList.add("hidden");
  document.getElementById("deathScreen").classList.remove("hidden");
  gameStarted = false;
  
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: player.x + player.width/2,
      y: player.y + player.height/2,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12 - 4,
      life: 50,
      size: Math.random() * 5 + 2,
      color: '#ff0000'
    });
  }
}

function takeDamage(amount, cause) {
  if (gameState.damageInvincibility > 0) return;
  
  gameState.health -= amount;
  gameState.damageInvincibility = 60;
  updateHUD();
  
  if (gameState.health <= 0) {
    die(cause);
  }
}

function update() {
  if (!gameStarted) return;

  if (!map || !Array.isArray(map)) return;
  
  if (gameState.damageInvincibility > 0) {
    gameState.damageInvincibility--;
  }

  let moveSpeed = currentTheme === THEMES.ICE ? 3 : 5;
  
  // Check if on rope
  player.onRope = isRopeAt(player.x + player.width/2, player.y + player.height/2);
  player.climbing = false;

  if (player.onRope) {
    // Rope climbing mechanics
    player.vx *= 0.8;
    player.vy *= 0.8;
    
    if (keys["w"]) {
      player.vy = -4;
      player.climbing = true;
    } else if (keys["s"]) {
      player.vy = 4;
      player.climbing = true;
    } else {
      player.vy *= 0.9;
    }
    
    if (keys["a"]) {
      player.vx = -3;
      player.facingRight = false;
    } else if (keys["d"]) {
      player.vx = 3;
      player.facingRight = true;
    }
    
    if (keys[" "]) {
      player.onRope = false;
      player.vy = -12;
    }
  } else {
    // Normal movement
    if (keys["a"]) {
      player.vx = -moveSpeed;
      player.facingRight = false;
    } else if (keys["d"]) {
      player.vx = moveSpeed;
      player.facingRight = true;
    } else {
      player.vx *= 0.85;
    }

    if (keys["w"] && player.onGround) {
      player.vy = -14;
      player.onGround = false;
    }

    player.vy += GRAVITY;
  }

  player.x += player.vx;
  player.x = Math.max(0, Math.min(player.x, mapWidth * TILE - player.width));

  if (solidAt(player.x, player.y) || solidAt(player.x + player.width, player.y) ||
      solidAt(player.x, player.y + player.height - 1) || solidAt(player.x + player.width, player.y + player.height - 1)) {
    player.x -= player.vx;
    player.vx = 0;
  }

  player.onGround = false;
  player.y += player.vy;
  player.y = Math.max(0, Math.min(player.y, mapHeight * TILE - player.height));

  if (player.vy > 0 && (solidAt(player.x + 4, player.y + player.height) || solidAt(player.x + player.width - 4, player.y + player.height))) {
    player.y = Math.floor((player.y + player.height) / TILE) * TILE - player.height;
    player.vy = 0;
    player.onGround = true;
  }

  if (player.vy < 0 && (solidAt(player.x + 4, player.y) || solidAt(player.x + player.width - 4, player.y))) {
    player.y = Math.ceil(player.y / TILE) * TILE;
    player.vy = 0;
  }

  if (whip.active) {
    whip.frames--;
    if (whip.frames <= 0) whip.active = false;
  }

  traps.forEach(trap => {
    if (!trap || !trap.active) return;

    if (trap.type === 'arrow') {
      trap.cooldown = Math.max(0, trap.cooldown - 1);
      let playerTileX = Math.floor(player.x / TILE);
      let trapTileX = Math.floor(trap.x / TILE);
      let playerTileY = Math.floor(player.y / TILE);
      let trapTileY = Math.floor(trap.y / TILE);

      if (Math.abs(playerTileY - trapTileY) === 0 && Math.abs(playerTileX - trapTileX) < 4 && trap.cooldown === 0) {
        arrows.push({
          x: trap.x,
          y: trap.y + TILE / 2,
          vx: trap.direction * 10,
          active: true
        });
        trap.cooldown = 120;
        screenShake.intensity = 4;
      }
    } else if (trap.type === 'spike') {
      if (
        player.y + player.height >= trap.y &&
        player.y + player.height <= trap.y + TILE / 2 &&
        Math.abs(player.x - trap.x) < TILE - 10 &&
        !gameState.hasSpikeBboots
      ) {
        die("Impaled on spikes");
      }
    }
  });

  arrows = arrows.filter(arrow => {
    if (!arrow) return false;

    arrow.x += arrow.vx;

    if (arrow.x < 0 || arrow.x > mapWidth * TILE) return false;
    if (solidAt(arrow.x, arrow.y)) return false;

    if (
      player.x < arrow.x + 20 &&
      player.x + player.width > arrow.x &&
      player.y < arrow.y + 10 &&
      player.y + player.height > arrow.y
    ) {
      takeDamage(1, "Shot by arrow trap");
      return false;
    }
    return true;
  });

  bombs = bombs.filter(b => {
    if (!b) return false;
    
    b.vy += GRAVITY;
    b.x += b.vx;
    b.y += b.vy;
    
    if (solidAt(b.x, b.y + TILE/2)) {
      b.vx *= 0.5;
      b.vy = 0;
      b.y = Math.floor(b.y / TILE) * TILE;
    }

    b.timer--;
    if (b.timer <= 0 && !b.exploded) {
      b.exploded = true;
      const bx = Math.floor(b.x / TILE);
      const by = Math.floor(b.y / TILE);

      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          if (bx + dx >= 0 && bx + dx < mapWidth && by + dy >= 0 && by + dy < mapHeight) {
            if (dx * dx + dy * dy <= 6) {
              destroyBlock(bx + dx, by + dy);
            }
          }
        }
      }

      for (let i = 0; i < 25; i++) {
        particles.push({
          x: b.x + TILE / 2,
          y: b.y + TILE / 2,
          vx: (Math.random() - 0.5) * 15,
          vy: (Math.random() - 0.5) * 15 - 3,
          life: 40,
          size: Math.random() * 6 + 2,
          color: Math.random() > 0.5 ? '#ff8800' : '#ffff00'
        });
      }

      enemies.forEach(e => {
        if (e) {
          let dist = Math.hypot(e.x - b.x, e.y - b.y);
          if (dist < TILE * 3.5) {
            e.health = 0;
          }
        }
      });

      let pdist = Math.hypot(player.x - b.x, player.y - b.y);
      if (pdist < TILE * 3) {
        takeDamage(1, "Blown up by own bomb");
      }

      screenShake.intensity = 15;
      return false;
    }
    return b.timer > -10;
  });

  particles.forEach(p => {
    if (!p) return;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    p.life--;
  });
  particles = particles.filter(p => p && p.life > 0);
  if (particles.length > 100) particles = particles.slice(-100);

  gold = gold.filter(g => {
    if (!g) return false;
    g.pulse += 0.1;
    if (
      Math.abs(player.x - g.x) < TILE &&
      Math.abs(player.y - g.y) < TILE
    ) {
      gameState.gold += g.value;
      updateHUD();
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: g.x + TILE / 2,
          y: g.y + TILE / 2,
          vx: (Math.random() - 0.5) * 5,
          vy: (Math.random() - 0.5) * 5 - 2,
          life: 25,
          size: 3,
          color: '#ffd700'
        });
      }
      return false;
    }
    return true;
  });
  
  gems = gems.filter(g => {
    if (!g) return false;
    g.pulse += 0.1;
    if (
      Math.abs(player.x - g.x) < TILE &&
      Math.abs(player.y - g.y) < TILE
    ) {
      gameState.gold += g.value;
      updateHUD();
      let color = g.type === 'ruby' ? '#ff0000' : g.type === 'emerald' ? '#00ff00' : '#0080ff';
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: g.x + TILE / 2,
          y: g.y + TILE / 2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 3,
          life: 30,
          size: 4,
          color: color
        });
      }
      showNotification(`💎 +$${g.value}!`);
      return false;
    }
    return true;
  });

  shops.forEach(shop => {
    if (shop && shop.shopkeeper) {
      const sk = shop.shopkeeper;
      if (sk.angry) {
        sk.vx = player.x < sk.x ? -4 : 4;
        sk.x += sk.vx;
        sk.x = Math.max(0, Math.min(sk.x, mapWidth * TILE - TILE));
        if (
          Math.abs(player.x - sk.x) < TILE &&
          Math.abs(player.y - sk.y) < TILE
        ) {
          takeDamage(1, "Killed by angry shopkeeper");
        }
        if (whip.active && whip.frames > 5) {
          let whipX = player.x + (player.facingRight ? player.width : -TILE * 1.5);
          if (
            sk.x < whipX + TILE * 1.5 &&
            sk.x + TILE > whipX &&
            sk.y < player.y + TILE &&
            sk.y + TILE > player.y
          ) {
            sk.health--;
            if (sk.health <= 0) {
              gameState.kills++;
              showNotification("💀 SHOPKEEPER DOWN!");
            }
          }
        }
      }
    }
  });

  enemies = enemies.filter(e => {
    if (!e || (e.health <= 0 && !e.stunned)) return false;

    if (e.type === 'skeleton' && e.health <= 0 && !e.stunned) {
      e.stunned = true;
      e.reassembleTimer = 180;
    }

    if (e.stunned) {
      e.reassembleTimer--;
      if (e.reassembleTimer <= 0) {
        e.health = 3;
        e.stunned = false;
      }
      return true;
    }

    try {
      if (e.type === 'bat') {
        e.x += e.vx;
        e.y += Math.sin(Date.now() / 200 + e.x) * 2;
        if (Math.random() < 0.03) e.vx *= -1;
        if (solidAt(e.x, e.y)) e.vx *= -1;
      } else {
        e.vy += GRAVITY;
        e.x += e.vx;
        if (solidAt(e.x, e.y + TILE)) {
          e.onGround = true;
          e.vy = 0;
        } else {
          e.onGround = false;
        }
        if (solidAt(e.x + e.vx * 5, e.y) || !solidAt(e.x + e.vx * TILE, e.y + TILE + 5)) {
          e.vx *= -1;
        }
        e.y += e.vy;
      }
      
      e.x = Math.max(0, Math.min(e.x, mapWidth * TILE - TILE));
      e.y = Math.max(0, Math.min(e.y, mapHeight * TILE - TILE));
    } catch (err) {
      console.error("Error updating enemy:", err);
    }

    if (whip.active && whip.frames > 5) {
      let whipX = player.x + (player.facingRight ? player.width : -TILE * 1.5);
      let whipY = player.y;
      if (
        e.x < whipX + TILE * 1.5 &&
        e.x + TILE > whipX &&
        e.y < whipY + TILE &&
        e.y + TILE > whipY
      ) {
        e.health--;
        if (e.health <= 0 && e.type !== 'skeleton') {
          gameState.kills++;
          showNotification(`💀 ${e.type.toUpperCase()} DEFEATED!`);
        }
        for (let i = 0; i < 6; i++) {
          particles.push({
            x: e.x + TILE / 2,
            y: e.y + TILE / 2,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8 - 3,
            life: 25,
            size: 4,
            color: '#888'
          });
        }
      }
    }

    if (
      player.x < e.x + TILE - 8 &&
      player.x + player.width > e.x + 8 &&
      player.y < e.y + TILE - 8 &&
      player.y + player.height > e.y + 8 &&
      gameState.damageInvincibility === 0
    ) {
      if (gameState.hasSpikeBboots && player.vy > 0 && player.y < e.y) {
        e.health = 0;
        player.vy = -10;
        gameState.kills++;
        showNotification(`💀 STOMPED ${e.type.toUpperCase()}!`);
      } else {
        takeDamage(1, `Killed by ${e.type}`);
        player.vy = -10;
        player.x += player.facingRight ? -30 : 30;
      }
    }

    return e.health > 0 || e.stunned;
  });

  const doorCenterX = door.x * TILE + TILE;
  const doorCenterY = door.y * TILE + TILE / 2;
  if (
    Math.abs(player.x + player.width / 2 - doorCenterX) < TILE * 1.5 &&
    Math.abs(player.y + player.height / 2 - doorCenterY) < TILE * 1.5
  ) {
    nextLevel();
  }

  updateCamera();
}

function nextLevel() {
  gameState.sublevel++;
  if (gameState.sublevel > 4) {
    gameState.sublevel = 1;
    gameState.level++;
    updateTheme();
    showNotification(`🎉 LEVEL ${gameState.level}!`);
  } else {
    showNotification(`✨ LEVEL ${gameState.level}-${gameState.sublevel}!`);
  }
  
  gameState.bombs = Math.min(gameState.bombs + 1, 8);
  gameState.ropes = Math.min(gameState.ropes + 1, 8);
  if (gameState.health < 4) gameState.health++;
  updateHUD();
  resetLevel();
}

function resetLevel() {
  player.x = 100;
  player.y = 80;
  player.vx = 0;
  player.vy = 0;
  player.onGround = false;
  player.onRope = false;
  player.climbing = false;
  generateCaveMap();
  generateTraps();
  generateShop();
  generateCrates();
  generateGems();
  spawnEnemies();
  spawnGold();
  spawnItems();
  bombs = [];
  arrows = [];
  particles = [];
  camera.x = 0;
  camera.y = 0;
}

function updateHUD() {
  document.getElementById("bombs").textContent = gameState.bombs;
  document.getElementById("ropes").textContent = gameState.ropes;
  document.getElementById("health").textContent = gameState.health;
  document.getElementById("level").textContent = `${gameState.level}-${gameState.sublevel}`;
  document.getElementById("gold").textContent = gameState.gold;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if (!gameStarted) return;
  
  ctx.save();
  ctx.translate(-camera.x + screenShake.x, -camera.y + screenShake.y);
  
  const bgGradient = ctx.createRadialGradient(
    camera.x + canvas.width/2, camera.y + canvas.height/2, 0,
    camera.x + canvas.width/2, camera.y + canvas.height/2, canvas.width
  );
  bgGradient.addColorStop(0, currentTheme.bg);
  bgGradient.addColorStop(1, '#000000');
  ctx.fillStyle = bgGradient;
  ctx.fillRect(camera.x, camera.y, canvas.width, canvas.height);
  
  // Draw map
  for (let y = Math.floor(camera.y / TILE); y < Math.ceil((camera.y + canvas.height) / TILE); y++) {
    for (let x = Math.floor(camera.x / TILE); x < Math.ceil((camera.x + canvas.width) / TILE); x++) {
      if (y >= 0 && y < mapHeight && x >= 0 && x < mapWidth && map[y] && map[y][x] === 1) {
        ctx.fillStyle = currentTheme.rock;
        ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
        
        ctx.fillStyle = currentTheme.rockDark;
        ctx.fillRect(x * TILE + 2, y * TILE + 2, TILE - 4, TILE - 4);
        
        ctx.fillStyle = currentTheme.rockLight;
        ctx.fillRect(x * TILE + 4, y * TILE + 4, TILE - 24, 3);
        
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.fillRect(x * TILE, y * TILE + TILE - 6, TILE, 6);
      }
    }
  }
  
  // Crates
  crates.forEach(crate => {
    if (!crate.broken) {
      ctx.fillStyle = '#8b7355';
      ctx.fillRect(crate.x, crate.y, TILE, TILE);
      
      ctx.strokeStyle = '#654321';
      ctx.lineWidth = 3;
      ctx.strokeRect(crate.x + 2, crate.y + 2, TILE - 4, TILE - 4);
      
      ctx.strokeRect(crate.x + 10, crate.y + 10, TILE - 20, TILE - 20);
    }
  });
  
  // Traps
  traps.forEach(trap => {
    if (!trap) return;
    if (trap.type === 'arrow' && trap.active) {
      ctx.fillStyle = '#444';
      ctx.fillRect(trap.x, trap.y + TILE/2 - 4, TILE, 8);
      
      ctx.fillStyle = '#ff3300';
      ctx.fillRect(trap.x + (trap.direction > 0 ? TILE - 6 : 0), trap.y + TILE/2 - 2, 6, 4);
    } else if (trap.type === 'spike') {
      ctx.fillStyle = '#666';
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(trap.x + i * 12, trap.y + TILE);
        ctx.lineTo(trap.x + i * 12 + 6, trap.y + TILE - 16);
        ctx.lineTo(trap.x + i * 12 + 12, trap.y + TILE);
        ctx.fill();
      }
      
      ctx.fillStyle = '#999';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(trap.x + i * 12 + 4, trap.y + TILE - 10, 2, 4);
      }
    }
  });
  
  // Arrows
  arrows.forEach(arrow => {
    if (!arrow) return;
    ctx.fillStyle = '#654321';
    ctx.fillRect(arrow.x, arrow.y - 2, 20, 4);
    
    ctx.fillStyle = '#999';
    ctx.beginPath();
    ctx.moveTo(arrow.x + (arrow.vx > 0 ? 20 : 0), arrow.y - 4);
    ctx.lineTo(arrow.x + (arrow.vx > 0 ? 26 : -6), arrow.y);
    ctx.lineTo(arrow.x + (arrow.vx > 0 ? 20 : 0), arrow.y + 4);
    ctx.fill();
  });
  
  // Ropes with better visuals
  ropes.forEach(rope => {
    if (!rope) return;
    ctx.strokeStyle = '#8b7355';
    ctx.lineWidth = 5;
    ctx.shadowBlur = 3;
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.moveTo(rope.x + TILE/2, rope.y);
    ctx.lineTo(rope.x + TILE/2, rope.y + TILE);
    ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Rope knots
    ctx.fillStyle = '#6a5335';
    ctx.fillRect(rope.x + TILE/2 - 3, rope.y + TILE/4, 6, 4);
    ctx.fillRect(rope.x + TILE/2 - 3, rope.y + TILE * 3/4, 6, 4);
  });
  
  // Door
  let doorPulse = Math.sin(Date.now() / 400) * 0.15 + 1;
  
  ctx.fillStyle = '#654321';
  ctx.fillRect(door.x * TILE - TILE/2, door.y * TILE, TILE * 2.5, TILE * 2);
  
  ctx.fillStyle = '#8b6914';
  ctx.fillRect(door.x * TILE - TILE/2 + 3, door.y * TILE + 3, TILE * 2.5 - 6, TILE * 2 - 6);
  
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 6;
  ctx.strokeRect(door.x * TILE - TILE/2, door.y * TILE, TILE * 2.5, TILE * 2);
  
  ctx.fillStyle = `rgba(255, 215, 0, ${doorPulse})`;
  ctx.shadowBlur = 20 * doorPulse;
  ctx.shadowColor = '#ffd700';
  ctx.beginPath();
  ctx.arc(door.x * TILE + TILE * 1.5, door.y * TILE + TILE, 10, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  
  // Shops
  shops.forEach(shop => {
    if (!shop) return;
    ctx.fillStyle = 'rgba(139, 69, 19, 0.3)';
    ctx.fillRect(shop.x, shop.y, TILE * 6, TILE * 4);
    
    ctx.strokeStyle = '#ff8c00';
    ctx.lineWidth = 4;
    ctx.strokeRect(shop.x, shop.y, TILE * 6, TILE * 4);
    
    if (shop.shopkeeper) {
      let sk = shop.shopkeeper;
      
      ctx.fillStyle = sk.angry ? '#ff0000' : '#8b7355';
      ctx.fillRect(sk.x, sk.y, TILE, TILE);
      
      ctx.fillStyle = '#000';
      ctx.fillRect(sk.x + 8, sk.y + 12, 4, 4);
      ctx.fillRect(sk.x + 18, sk.y + 12, 4, 4);
    }
    
    if (shop.items) {
      shop.items.forEach(item => {
        if (!item) return;
        ctx.fillStyle = '#654321';
        ctx.fillRect(item.x, item.y, TILE, TILE);
        
        if (item.type === 'bombs') {
          ctx.fillStyle = '#2a2a2a';
          ctx.beginPath();
          ctx.arc(item.x + TILE/2, item.y + TILE/2, 10, 0, Math.PI * 2);
          ctx.fill();
        } else if (item.type === 'ropes') {
          ctx.strokeStyle = '#8b7355';
          ctx.lineWidth = 3;
          ctx.strokeRect(item.x + 8, item.y + 8, TILE - 16, TILE - 16);
        } else if (item.type === 'compass') {
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(item.x + TILE/2, item.y + TILE/2, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ff0000';
          ctx.beginPath();
          ctx.moveTo(item.x + TILE/2, item.y + TILE/2);
          ctx.lineTo(item.x + TILE/2, item.y + TILE/2 - 8);
          ctx.stroke();
        }
        
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 12px monospace';
        ctx.fillText(`$${item.cost}`, item.x + 2, item.y - 6);
      });
    }
  });
  
  // Gold
  gold.forEach(g => {
    if (!g) return;
    let pulse = Math.sin(g.pulse) * 0.3 + 1;
    let size = (g.value > 100 ? 14 : 10) * pulse;
    
    ctx.fillStyle = '#ffd700';
    ctx.shadowBlur = 25;
    ctx.shadowColor = '#ffd700';
    ctx.beginPath();
    ctx.arc(g.x + TILE/2, g.y + TILE/2, size, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#ffed4e';
    ctx.beginPath();
    ctx.arc(g.x + TILE/2 - 2, g.y + TILE/2 - 2, size * 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });
  
  // Gems
  gems.forEach(g => {
    if (!g) return;
    let pulse = Math.sin(g.pulse) * 0.25 + 1;
    let size = 12 * pulse;
    
    let color = g.type === 'ruby' ? '#ff0000' : g.type === 'emerald' ? '#00ff00' : '#0080ff';
    
    ctx.fillStyle = color;
    ctx.shadowBlur = 30;
    ctx.shadowColor = color;
    
    ctx.save();
    ctx.translate(g.x + TILE/2, g.y + TILE/2);
    ctx.rotate(Math.PI / 4);
    ctx.fillRect(-size/2, -size/2, size, size);
    ctx.restore();
    
    ctx.shadowBlur = 0;
  });
  
  // Items
  items.forEach(item => {
    if (!item) return;
    
    let floatY = Math.sin(Date.now() / 500) * 5;
    
    if (item.type === 'bombs') {
      ctx.fillStyle = '#2a2a2a';
      ctx.beginPath();
      ctx.arc(item.x + TILE/2, item.y + TILE/2 + floatY, 12, 0, Math.PI * 2);
      ctx.fill();
    } else if (item.type === 'ropes') {
      ctx.strokeStyle = '#8b7355';
      ctx.lineWidth = 4;
      ctx.strokeRect(item.x + 6, item.y + 6 + floatY, TILE - 12, TILE - 12);
    } else if (item.type === 'spikeboots') {
      ctx.fillStyle = '#654321';
      ctx.fillRect(item.x + 6, item.y + 14 + floatY, TILE - 12, TILE/2);
      ctx.fillStyle = '#999';
      for (let i = 0; i < 3; i++) {
        ctx.fillRect(item.x + 8 + i * 5, item.y + 26 + floatY, 3, 6);
      }
    } else if (item.type === 'spectacles') {
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(item.x + TILE/2 - 6, item.y + TILE/2 + floatY, 8, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(item.x + TILE/2 + 6, item.y + TILE/2 + floatY, 8, 0, Math.PI * 2);
      ctx.stroke();
    }
  });
  
  // Particles
  particles.forEach(p => {
    if (!p) return;
    let alpha = p.life / 40;
    
    if (p.color) {
      if (p.color.startsWith('#')) {
        const r = parseInt(p.color.slice(1, 3), 16);
        const g = parseInt(p.color.slice(3, 5), 16);
        const b = parseInt(p.color.slice(5, 7), 16);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      } else {
        ctx.fillStyle = p.color;
      }
    } else {
      ctx.fillStyle = `rgba(139, 69, 19, ${alpha})`;
    }
    
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  
  // Player with damage flash
  ctx.save();
  
  if (gameState.damageInvincibility > 0 && gameState.damageInvincibility % 10 < 5) {
    ctx.globalAlpha = 0.5;
  }
  
  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.fillRect(player.x - 1, player.y + player.height, player.width + 2, 3);
  
  ctx.fillStyle = '#8b7355';
  ctx.fillRect(player.x, player.y, player.width, player.height);
  
  ctx.fillStyle = '#d4a574';
  ctx.fillRect(player.x + 5, player.y + 5, player.width - 10, player.height - 10);
  
  // Hat
  ctx.fillStyle = '#654321';
  ctx.fillRect(player.x + 3, player.y, player.width - 6, 8);
  
  ctx.fillStyle = '#8b6914';
  ctx.fillRect(player.x + 5, player.y + 1, player.width - 10, 2);
  
  // Spectacles
  if (gameState.hasSpectacles) {
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(player.x + 8, player.y + 13, 3, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(player.x + player.width - 8, player.y + 13, 3, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // Spike boots
  if (gameState.hasSpikeBboots) {
    ctx.fillStyle = '#999';
    ctx.fillRect(player.x + 5, player.y + player.height - 3, 6, 3);
    ctx.fillRect(player.x + player.width - 11, player.y + player.height - 3, 6, 3);
  }
  
  // Eyes
  ctx.fillStyle = '#000';
  if (player.facingRight) {
    ctx.fillRect(player.x + player.width - 10, player.y + 12, 4, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + player.width - 9, player.y + 13, 2, 2);
  } else {
    ctx.fillRect(player.x + 6, player.y + 12, 4, 4);
    ctx.fillStyle = '#fff';
    ctx.fillRect(player.x + 7, player.y + 13, 2, 2);
  }
  
  ctx.restore();
  
  // Whip
  if (whip.active) {
    ctx.strokeStyle = '#8b7355';
    ctx.lineWidth = 3;
    ctx.shadowBlur = 5;
    ctx.shadowColor = '#ffd700';
    
    let whipLen = (12 - whip.frames) * 8;
    let whipX = player.x + (player.facingRight ? player.width : 0);
    let whipY = player.y + player.height / 2;
    
    ctx.beginPath();
    ctx.moveTo(whipX, whipY);
    ctx.lineTo(whipX + (player.facingRight ? whipLen : -whipLen), whipY);
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  
  // Enemies
  enemies.forEach(e => {
    if (!e) return;
    if (e.stunned) {
      ctx.fillStyle = '#ddd';
      ctx.fillRect(e.x + 6, e.y + 18, TILE - 12, 4);
      ctx.fillRect(e.x + 10, e.y + 14, 8, 10);
      return;
    }
    
    if (e.type === 'bat') {
      ctx.fillStyle = '#4a235a';
      ctx.fillRect(e.x + 6, e.y + 10, TILE - 12, TILE - 12);
      
      let wingFlap = Math.sin(Date.now() / 100) * 8;
      ctx.fillRect(e.x, e.y + 14, 6, 10 + wingFlap);
      ctx.fillRect(e.x + TILE - 6, e.y + 14, 6, 10 + wingFlap);
      
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(e.x + 10, e.y + 12, 3, 3);
      ctx.fillRect(e.x + TILE - 13, e.y + 12, 3, 3);
    } else if (e.type === 'snake') {
      ctx.fillStyle = '#2d5016';
      ctx.fillRect(e.x + 3, e.y + 14, TILE - 6, TILE/2);
      ctx.fillRect(e.x + 6, e.y + 10, TILE - 12, TILE/2);
      
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(e.x + (e.vx > 0 ? TILE - 8 : 5), e.y + 16, 4, 2);
    } else if (e.type === 'caveman') {
      ctx.fillStyle = '#d4a574';
      ctx.fillRect(e.x + 6, e.y + 6, TILE - 12, TILE - 6);
      
      ctx.fillStyle = '#654321';
      ctx.fillRect(e.x + 5, e.y + 3, TILE - 10, 8);
      
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x + 10, e.y + 14, 3, 3);
      ctx.fillRect(e.x + TILE - 13, e.y + 14, 3, 3);
    } else if (e.type === 'skeleton') {
      ctx.fillStyle = '#ddd';
      ctx.fillRect(e.x + 8, e.y + 6, TILE - 16, TILE - 10);
      ctx.fillRect(e.x + 6, e.y + 16, TILE - 12, TILE - 18);
      
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x + 10, e.y + 10, 3, 5);
      ctx.fillRect(e.x + TILE - 13, e.y + 10, 3, 5);
    } else {
      ctx.fillStyle = '#1a1a1a';
      ctx.fillRect(e.x + 6, e.y + 10, TILE - 12, TILE - 12);
      
      ctx.fillStyle = '#0a0a0a';
      for (let i = 0; i < 4; i++) {
        ctx.fillRect(e.x + i * 7, e.y + 18, 3, 10);
      }
      
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(e.x + 8, e.y + 12, 2, 2);
      ctx.fillRect(e.x + TILE - 10, e.y + 12, 2, 2);
    }
  });
  
  // Bombs
  bombs.forEach(b => {
    if (!b) return;
    if (!b.exploded) {
      let flash = b.timer % 20 < 10;
      let pulseSize = 14 + Math.sin(Date.now() / 80) * 2;
      
      ctx.fillStyle = flash ? '#2a2a2a' : '#ff0000';
      ctx.shadowBlur = flash ? 25 : 10;
      ctx.shadowColor = flash ? '#ff0000' : '#000';
      ctx.beginPath();
      ctx.arc(b.x + TILE/2, b.y + TILE/2, pulseSize, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      
      ctx.strokeStyle = '#654321';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x + TILE/2, b.y + TILE/2 - pulseSize);
      ctx.lineTo(b.x + TILE/2 + 5, b.y + TILE/2 - pulseSize - 6);
      ctx.stroke();
      
      if (flash) {
        ctx.fillStyle = '#ffff00';
        ctx.shadowBlur = 15;
        ctx.shadowColor = '#ffff00';
        ctx.beginPath();
        ctx.arc(b.x + TILE/2 + 5, b.y + TILE/2 - pulseSize - 6, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    } else {
      let alpha = Math.max(0, -b.timer / 10);
      let radius = 80 + b.timer * -8;
      
      const grad = ctx.createRadialGradient(
        b.x + TILE/2, b.y + TILE/2, 0,
        b.x + TILE/2, b.y + TILE/2, radius
      );
      grad.addColorStop(0, `rgba(255, 255, 0, ${alpha})`);
      grad.addColorStop(0.4, `rgba(255, 150, 0, ${alpha})`);
      grad.addColorStop(1, `transparent`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(b.x + TILE/2, b.y + TILE/2, radius, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  
  // Compass indicator
  if (gameState.hasCompass) {
    let angle = Math.atan2(door.y * TILE - player.y, door.x * TILE - player.x);
    let indicatorX = player.x + player.width/2 + Math.cos(angle) * 50;
    let indicatorY = player.y + player.height/2 + Math.sin(angle) * 50;
    
    ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#ffd700';
    ctx.beginPath();
    ctx.moveTo(indicatorX, indicatorY);
    ctx.lineTo(indicatorX + Math.cos(angle + 2.8) * 10, indicatorY + Math.sin(angle + 2.8) * 10);
    ctx.lineTo(indicatorX + Math.cos(angle - 2.8) * 10, indicatorY + Math.sin(angle - 2.8) * 10);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  ctx.restore();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

generateCaveMap();
updateHUD();
updateTheme();
loop();
</script>
</body>
