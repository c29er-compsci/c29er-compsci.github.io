<!DOCTYPE html>
<html>
<head>
	<style>
		#train {
			display: flex;
			gap: 12px;
		}
		.cart{
			min-width: 100px;
			height: 80px;
			border: 1px solid black;
			text-align: center;
			position: relative;
		}
		.cart:before {
			content:"🛞" ;
			width: 30px;
			height: 30px;
			border: 1px solid black;
			display: block;
			border-radius: 50%;
			position: absolute;
			bottom: -15px;
			left: 10px;
			background: white;
		}

		.cart:after{
			content:"🛞" ;
			width: 30px;
			height: 30px;
			border: 1px solid black;
			display: block;
			border-radius: 50%;
			position: absolute;
			bottom: -15px;
			left: 65px;
			background: white;
		}
	</style>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>document</title>
</head>
<body>
	<input type="text" id="person">
	<button id="add-person"> add person </button>
	<button id="remove-person"> remove person </button>

	<div id="train">
		<div class="cart">Evren</div>
		<div class="cart">lukas</div>
		<div class="cart">matthew</div>
		<div class="cart">kendrick</div>
	</div>

	<script>

let people = ["jamie", "evren", "lukas"]
let addPersonBtn = document.getElementById("add-person")

people.push("matthew")
people.push("kendrick")
console.log	(people)
addPersonBtn.addEventListener("click", function() {

	let personInput = document.getElementById("person")
	people.push(personInput.value)
	personInput.value = ""
	console.log(people) } )

 let removePersonBtn = document.getElementById("remove-person")
 removePersonBtn.addEventListener("click", function() {
 	people.pop()
 	console.log(people)


 })



 
 	


	</script>
</body>
</html>
